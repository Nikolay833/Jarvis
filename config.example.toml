# Copy to config.toml (repo root) or %APPDATA%\Jarvis\config.toml.
# Every key is optional; values below are the defaults.

[ollama]
url = "http://127.0.0.1:11434"
model = "qwen3:14b"
think = false          # ask Ollama to skip qwen3 thinking (faster replies)
timeout = 120.0        # seconds per LLM request
num_ctx = 8192
keep_alive = "-1"         # "-1" = never unload the model; or a duration like "30m"
max_reply_tokens = 450  # cap per LLM step (num_predict); 0 = no limit

[stt]
engine = "whisper"       # "whisper" (faster-whisper) or "parakeet" (needs: pip install "onnx-asr[gpu,hub]")

[whisper]
model = "large-v3"       # "large-v3-turbo" is faster but less accurate
device = "cuda"          # "cuda" or "cpu"
compute_type = "float16" # "float16" on GPU, "int8" on CPU
fallback_model = "small" # used on CPU if the GPU load fails
language = "en"
# Names Whisper should expect to hear. Add your own project or app names here.
vocabulary = ["Jarvis", "Claude", "Claude Code", "Spotify", "Chrome", "Discord", "VS Code", "PowerShell"]
beam_size = 5            # 1 = greedy (fastest), 5 = more accurate
best_of = 5
temperature = [0.0, 0.2, 0.4]  # retry ladder when a decode looks bad
vad_filter = true
vad_min_silence_ms = 500
vad_speech_pad_ms = 300  # padding stops VAD clipping the start of words
condition_on_previous_text = false
no_speech_threshold = 0.6
log_prob_threshold = -1.0
use_hotwords = true      # also pass the vocabulary as hotwords (faster-whisper >= 1.0)

[parakeet]
model = "nemo-parakeet-tdt-0.6b-v2"  # English; "nemo-parakeet-tdt-0.6b-v3" is multilingual
device = "cuda"          # falls back to CPU if the GPU provider fails

[tts]
voice = "bm_george"      # Kokoro British male: bm_george, bm_lewis, bm_daniel, bm_fable
                         # or a blend: "bm_george:0.6,bm_lewis:0.4"
lang_code = "b"          # "b" = British English
speed = 1.05             # Jarvis speaks briskly
fx = "jarvis"            # "jarvis" = subtle AI sheen (room, presence, chorus), "none" = plain voice
fx_amount = 0.35         # 0..1
# Audition presets: python -m jarvis.voices

[wakeword]
model = "hey_jarvis"
threshold = 0.5          # 0..1, raise if it triggers by accident

[audio]
input_device = ""        # empty = system default (name or index)
output_device = ""
silence_seconds = 1.2    # pause that ends your sentence (lower = snappier, but cuts you off mid-thought)
max_record_seconds = 20.0
no_speech_timeout = 6.0  # give up if nobody speaks after the wake word
announce_ready = true    # say "Online, sir." once models are loaded
chime = true             # soft chime when Jarvis starts listening
follow_up = true         # after Jarvis asks you something, listen for your answer without "Hey Jarvis"
follow_up_seconds = 6.0  # how long to wait for that answer
conversation = true      # keep listening after every reply (no "Hey Jarvis"); he leaves once you stop talking
conversation_seconds = 5.0  # silence that ends the conversation
barge_in = true          # talk over Jarvis to interrupt him; his own voice from the speakers is filtered out
barge_in_sensitivity = 0.5  # 0..1: higher interrupts sooner (lower echo margin, shorter speech) but misfires more
barge_in_min_ms = 250.0  # how long you must talk over him (at sensitivity 0.5)
barge_in_wake = true     # saying "Hey Jarvis" while he talks always interrupts

[bus]
host = "127.0.0.1"
port = 8765

[safety]
confirm_timeout = 30.0   # seconds; no answer counts as "no"

[agent]
max_steps = 8
max_history_messages = 30
fast_paths = true       # time, date, "open <app>", lock, stop, volume answered without the LLM
stream_replies = true   # speak sentences while the LLM is still generating

[claude_code]
binary = "claude"        # name on PATH or full path to claude / claude.cmd
permission_mode = "acceptEdits"

[claude_watch]
# Jarvis speaks up when Claude Code finishes or needs you. Needs the Claude Code hooks:
#   .venv\Scripts\python scripts\install_claude_hooks.py     (remove with --uninstall)
enabled = true
announce_finish = true      # "Sir, Claude finished in <project>: ..."
announce_permission = true  # "Sir, Claude needs your permission in <project>."
min_turn_seconds = 20.0     # only announce "finished" if the turn took at least this long (seconds)
voice_approval = true      # "Sir, Claude wants to run npm install in X. Shall I allow it?" yes/no by voice;
                            # no answer in time = Claude asks on screen as usual. Never auto-allows.

[memory]
enabled = true           # "remember that ...", "what do you remember", "forget ...": facts live in %APPDATA%\Jarvis\memory.json
max_facts = 200

[reminders]
enabled = true           # "set a timer for 10 minutes", "remind me at 6pm to ...": announced out loud when due
chime = true             # gentle chime before the announcement

[briefing]
enabled = true           # "give me my briefing": greeting, date, weather, reminders, Claude sessions
auto_first_wake = true   # speak it automatically the first time you wake Jarvis each day
after_hour = 5           # ...after this hour (0-23)
city = "Sofia"
latitude = 42.6977
longitude = 23.3219
include_weather = true   # Open-Meteo, free, no key; skipped silently if offline
include_reminders = true
include_claude = true    # Claude Code sessions active since yesterday

[spotify]
# Optional. Lets "play <song> on Spotify" find the exact track. Works on the FREE Spotify plan:
# create a free developer app at https://developer.spotify.com/dashboard (any redirect URI, e.g.
# http://127.0.0.1:8888/callback, no Premium needed; only song search is used) and paste its
# Client ID and Client secret. Without them Jarvis opens a Spotify search instead.
client_id = ""
client_secret = ""

[maps]
# "I want to go to X": full-screen map with car and walking routes plus a Google Maps public transport link.
# Location order: Windows location services (Settings > Privacy & security > Location, incl. "Let desktop apps
# access your location"), then the saved home address, then IP geolocation.
home_address = ""        # e.g. "12 Vitosha Blvd, Sofia"; empty = use a remembered "home is ..." fact
work_address = ""        # same for "take me to work"
default_city = "Sofia"   # retried with this appended when a place is not found
geocoder_url = "https://nominatim.openstreetmap.org"   # Nominatim, 1 request per second
routing_url = "https://routing.openstreetmap.de"       # FOSSGIS OSRM (routed-car, routed-foot)
show_transit_link = true # "Public transport" card opening Google Maps

[files]
# Optional. If non-empty, file tools only work inside these folders.
allowed_roots = []       # e.g. ["C:/Users/you/Documents", "D:/Projects"]

[vision]
# "What's on my screen", "read this error": a screenshot goes to a small local vision model via Ollama.
# qwen2.5vl:3b (~3 GB) fits beside qwen3:14b + Whisper on 16 GB; the 7b does not. Pull it: ollama pull qwen2.5vl:3b
model = "qwen2.5vl:3b"  # alternatives: gemma3:4b, llava-phi3
url = ""                 # empty = use [ollama] url
keep_alive = "2m"        # unload after use so qwen3 keeps its VRAM; the next call reloads it (a few seconds)
max_side = 1280          # screenshots are scaled down to this longest side
timeout = 90.0           # seconds; the first call also loads the model
max_reply_tokens = 400
webcam_enabled = false   # camera tool ("look at me"); off by default, needs: pip install -e ".[webcam]"
webcam_index = 0
