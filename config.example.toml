# Copy to config.toml (repo root) or %APPDATA%\Jarvis\config.toml.
# Every key is optional; values below are the defaults.

[ollama]
url = "http://127.0.0.1:11434"
model = "qwen3:14b"
think = false          # ask Ollama to skip qwen3 thinking (faster replies)
timeout = 120.0        # seconds per LLM request
num_ctx = 8192
keep_alive = "-1"         # "-1" = never unload the model; or a duration like "30m"
max_reply_tokens = 200  # cap per LLM step (num_predict); 0 = no limit

[stt]
engine = "whisper"       # "whisper" (faster-whisper) or "parakeet" (needs: pip install "onnx-asr[gpu,hub]")

[whisper]
model = "large-v3"       # "large-v3-turbo" is faster but less accurate
device = "cuda"          # "cuda" or "cpu"
compute_type = "float16" # "float16" on GPU, "int8" on CPU
fallback_model = "small" # used on CPU if the GPU load fails
language = "en"
# Names Whisper should expect to hear. Add your own project or app names here.
vocabulary = ["Jarvis", "Claude", "Claude Code", "Spotify", "Chrome", "Discord", "VS Code", "PowerShell"]
beam_size = 5            # 1 = greedy (fastest), 5 = more accurate
best_of = 5
temperature = [0.0, 0.2, 0.4]  # retry ladder when a decode looks bad
vad_filter = true
vad_min_silence_ms = 500
vad_speech_pad_ms = 300  # padding stops VAD clipping the start of words
condition_on_previous_text = false
no_speech_threshold = 0.6
log_prob_threshold = -1.0
use_hotwords = true      # also pass the vocabulary as hotwords (faster-whisper >= 1.0)

[parakeet]
model = "nemo-parakeet-tdt-0.6b-v2"  # English; "nemo-parakeet-tdt-0.6b-v3" is multilingual
device = "cuda"          # falls back to CPU if the GPU provider fails

[tts]
voice = "bm_george"      # Kokoro British male
lang_code = "b"          # "b" = British English
speed = 1.0

[wakeword]
model = "hey_jarvis"
threshold = 0.5          # 0..1, raise if it triggers by accident

[audio]
input_device = ""        # empty = system default (name or index)
output_device = ""
silence_seconds = 1.2    # pause that ends your sentence (lower = snappier, but cuts you off mid-thought)
max_record_seconds = 20.0
no_speech_timeout = 6.0  # give up if nobody speaks after the wake word
announce_ready = true    # say "Online, sir." once models are loaded
chime = true             # soft chime when Jarvis starts listening
follow_up = true         # after Jarvis asks you something, listen for your answer without "Hey Jarvis"
follow_up_seconds = 6.0  # how long to wait for that answer

[bus]
host = "127.0.0.1"
port = 8765

[safety]
confirm_timeout = 30.0   # seconds; no answer counts as "no"

[agent]
max_steps = 8
max_history_messages = 30
fast_paths = true       # time, date, "open <app>", lock, stop, volume answered without the LLM
stream_replies = true   # speak sentences while the LLM is still generating

[claude_code]
binary = "claude"        # name on PATH or full path to claude / claude.cmd
permission_mode = "acceptEdits"

[claude_watch]
# Jarvis speaks up when Claude Code finishes or needs you. Needs the Claude Code hooks:
#   .venv\Scripts\python scripts\install_claude_hooks.py     (remove with --uninstall)
enabled = true
announce_finish = true      # "Sir, Claude finished in <project>: ..."
announce_permission = true  # "Sir, Claude needs your permission in <project>."
min_turn_seconds = 20.0     # only announce "finished" if the turn took at least this long (seconds)

[spotify]
# Optional. Lets "play <song> on Spotify" find the exact track. Works on the FREE Spotify plan:
# create a free developer app at https://developer.spotify.com/dashboard (any redirect URI, e.g.
# http://127.0.0.1:8888/callback, no Premium needed; only song search is used) and paste its
# Client ID and Client secret. Without them Jarvis opens a Spotify search instead.
client_id = ""
client_secret = ""

[files]
# Optional. If non-empty, file tools only work inside these folders.
allowed_roots = []       # e.g. ["C:/Users/you/Documents", "D:/Projects"]
