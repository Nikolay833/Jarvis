[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Local voice assistant for Windows (wake word, Whisper, Ollama, Kokoro)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sounddevice",
    "openwakeword",
    "faster-whisper",
    "kokoro>=0.9",
    "websockets>=13",
    "httpx",
]

[project.optional-dependencies]
# Write config.toml from code (not needed to read it).
config = ["tomli-w"]
# Lets "play <song> on Spotify" press Play through UI Automation (optional; falls back to a key press).
ui = ["pywinauto; sys_platform == 'win32'"]
dev = ["pytest"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
