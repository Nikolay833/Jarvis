[package]
name = "jarvis-orb"
version = "0.1.0"
description = "Jarvis desktop overlay (orb)"
edition = "2021"

[lib]
name = "jarvis_orb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
