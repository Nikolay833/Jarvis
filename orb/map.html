<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070f" />
    <title>Jarvis Map</title>
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://tiles.basemaps.cartocdn.com" crossorigin />
  </head>
  <body translate="no">
    <div id="stage">
      <div id="map" aria-label="Map"></div>
      <div id="grid" aria-hidden="true"></div>
      <div id="vignette" aria-hidden="true"></div>
    </div>

    <button id="close" type="button" aria-label="Close map (Esc)" title="Close (Esc)">&times;</button>

    <section id="strip" aria-label="Directions">
      <h1 id="dest" aria-live="polite"></h1>
      <p id="note" hidden>From your approximate location</p>
      <div id="row">
        <div id="modes" role="radiogroup" aria-label="Travel mode"></div>
        <button id="open-transit" class="opt" type="button" aria-label="Public transport, opens in Google Maps">Transit &#8599;</button>
      </div>
      <button id="steps-toggle" type="button" aria-expanded="false" aria-controls="steps" hidden>Steps</button>
      <ol id="steps" tabindex="0" aria-label="Turn by turn steps" hidden></ol>
    </section>

    <p id="attrib">© OpenStreetMap contributors © CARTO</p>
    <script type="module" src="/src/map.ts"></script>
  </body>
</html>
